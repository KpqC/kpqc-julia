name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: "1.10"
          - os: ubuntu-latest
            julia-version: "1"
          - os: macos-latest
            julia-version: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Build native library
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  known-answer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Build with deterministic entropy hooks
        env:
          KPQC_TEST_ENTROPY: "1"
        run: julia --project=. deps/build.jl
      - name: Validate known-answer tests
        env:
          KPQC_TEST_ENTROPY: "1"
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: julia --project=. test/kat.jl
